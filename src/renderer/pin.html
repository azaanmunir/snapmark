<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>SnapMark Pin</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; user-select: none; -webkit-user-select: none; cursor: grab; }
    body.dragging { cursor: grabbing; }
    img { display: block; width: 100%; height: 100%; pointer-events: none; }
    img.pixelated { image-rendering: pixelated; }
    .frame { position: fixed; inset: 0; box-shadow: inset 0 0 0 1px rgba(10, 132, 255, 0.55); pointer-events: none; }
    body:not(:focus-within):not(.focused) .frame { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18); }
    #hud {
      position: fixed; right: 6px; bottom: 6px; padding: 3px 7px; border-radius: 6px;
      background: rgba(18, 18, 20, 0.9); color: #fff; font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap;
    }
    #hud.show { opacity: 1; }
  </style>
</head>
<body>
  <img id="img" alt="" />
  <div class="frame"></div>
  <div id="hud"></div>
  <script src="pin.js"></script>
</body>
</html>
